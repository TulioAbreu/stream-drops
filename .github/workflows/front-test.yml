name: Front Tests

on:
  pull_request:
    paths:
      - "apps/front/**"
      - "packages/**"
      - ".github/workflows/front-test.yml"
  push:
    branches:
      - homolog
    paths:
      - "apps/front/**"
      - "packages/**"
      - ".github/workflows/front-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # O tsc do front resolve @stream-drops/subathon-protocol pelos
      # tipos em dist/. Na Vercel o turbo gera isso antes de
      # @stream-drops/front:build (build.dependsOn: ["^build"]).
      - name: Build subathon protocol
        run: bun run --filter @stream-drops/subathon-protocol build

      - name: Build front
        working-directory: apps/front
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/front

      - name: Run tests
        run: bun run --filter @stream-drops/front test
